name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Start local Supabase
        run: npx supabase start
      - name: Reset local database and run pgTAP
        run: |
          npx supabase db reset --local
          npx supabase test db --local
      - name: Export local browser variables
        run: |
          eval "$(npx supabase status -o env)"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser acceptance tests
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
