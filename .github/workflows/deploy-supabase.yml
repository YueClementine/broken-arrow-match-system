name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: Apply pending migrations before deploying the function
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Link production project
        run: npx supabase link --project-ref hgrtlpekoblnnysmcspx --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Push migrations
        if: inputs.push_migrations
        run: npx supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Configure Edge origin
        run: npx supabase secrets set --project-ref hgrtlpekoblnnysmcspx SITE_ORIGIN="$SITE_ORIGIN"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      - name: Deploy optional BATrace function
        run: npx supabase functions deploy batrace-profile --project-ref hgrtlpekoblnnysmcspx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
